# Bang RL non-GUI lock file
#
# Purpose: reproducible learning and test installation. This file intentionally
# excludes the optional GUI extra so headless CI and training do not install
# PyQt6 or pyqtgraph.
#
# Policy:
#   1. Direct pins must match pyproject.toml exactly.
#   2. Every resolved transitive Python dependency is version-pinned here.
#   3. Regenerate with a lock resolver (for example pip-tools) after changing
#      pyproject.toml, review the diff, and commit this file with the change.
#   4. Install the non-GUI environment with:
#        python -m pip install -r requirements.lock
#      or, for an editable project install with test extras:
#        python -m pip install -e ".[test]"
#   5. GUI development uses requirements-gui.lock, never this file alone.

# Build-system dependencies
setuptools==75.8.0
wheel==0.45.1

# Direct runtime dependencies
pettingzoo==1.24.3
gymnasium==1.0.0
